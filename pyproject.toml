[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neis-meal-ai"
version = "0.1.0"
description = "NEIS 급식 데이터 분석과 개인별 추천 서비스"
requires-python = ">=3.11"
dependencies = [
  "gradio>=4.44,<7",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ipykernel>=6.25,<8"]
embedding = [
  "numpy==2.2.6",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "transformers>=4.57,<5",
  "sentence-transformers==5.6.1",
]
jupyter = [
  "notebook>=7.2,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "ipykernel>=6.25,<8",
  "ipywidgets>=8.1,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
